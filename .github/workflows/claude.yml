name: Claude Code

# 仅在评论 / Issue 中 @claude 时触发(不自动跑每个 PR,省额度)。
# 逻辑(@claude 过滤 + claude-code-action)在 UNILUME-AI/.github 的 reusable-claude.yml;
# 本文件只留触发器 + 权限 + 委派。触发器与 id-token 权限须留本仓(GitHub 只跑仓库内事件
# workflow,org .github 不下发 workflow;reusable 不能提权超过 caller 上限)。
# 交互式 @claude 走 Opus 4.8(经 claude_args 传入);本仓暂不启用自动评审(claude-review.yml)。
# 注意:issue_comment 类触发要求本 workflow 先在默认分支才生效。
#
# 不监听 pull_request_review(submitted):Codex 每提交一份自动评审就触发一次本 workflow,
# job 因 @claude 过滤被跳过,但 GitHub 仍会为跳过的 job 建 check run,在 PR 上留下一条
# "claude / claude  Skipped"。该事件的 run 挂在 PR head SHA 上,所以噪音直接进 checks 列表;
# issue_comment / issues 的 run 挂在默认分支 SHA 上,不进 PR checks,故保留。
# pull_request_review_comment 同样挂 PR head SHA,保留它是一个取舍:自动评审带行内意见时
# 每条意见各触发一次,噪音并未清零(只是不再叠加"提交整份 review"那一次);换来的是
# claude-code-action 对该事件走 createReplyForReviewComment,@claude 的回复留在同一条 review
# thread 内,与被回应的意见同处一地,便于改完即就地 resolve。判断是这点闭环值回那点噪音。
# 代价:不能再在"提交整份 review"的 body 里 @claude;改用 PR 顶层评论或行内评论,能力相同。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# 工作流级不授予任何权限，逐 job 最小授予：新增的 job 不会默认继承下面这一整套写权限。
permissions: {}

jobs:
  claude:
    permissions:
      contents: write
      actions: read # 让 claude-code-action 装 github_ci MCP(查 CI 状态 / 读 job 日志);reusable 也须声明
      checks: read # 让 @claude 读 Check 注解(SonarCloud 等),gh api check-runs/{id}/annotations;reusable 也须声明
      pull-requests: write
      issues: write
      id-token: write
    # 钉死 commit SHA（供应链规则：可变引用 @main 不过 Sonar 门）。升级 reusable 时改此 SHA：
    # gh api repos/UNILUME-AI/.github/commits/main --jq .sha
    uses: UNILUME-AI/.github/.github/workflows/reusable-claude.yml@b6a2e44e331ce54c1650eb0a90592db981122d84 # main 2026-08-02
    with:
      # allowedTools:CI 无人点确认,凡需确认的工具须显式列出(最小权限,全代理档)。
      #
      # disallowedTools 按命令拼写匹配,**不是安全边界**,只是把最常见的误操作拦在前面。
      # 同一动作的其他写法绕得过去,例如 `gh api -X PUT .../pulls/N/merge` 绕过
      # `gh pr merge`、`git push origin +HEAD:ref` 与 `--mirror` 绕过 `--force`/`-f`。
      # 真正的边界在 main 的 branch ruleset:non_fast_forward 挡强推、pull_request 挡直推、
      # deletion 挡删分支、required_status_checks 挡未过门的合并。改这份名单时别把它当护栏,
      # 该收紧的是 ruleset。
      claude_args: '--model claude-opus-4-8 --max-turns 100 --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__*" --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(rm -rf:*),Bash(gh pr merge:*),Bash(gh secret:*)"'
    secrets:
      # 显式传递而非 inherit：reusable 只声明了这一个 secret，最小权限
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
